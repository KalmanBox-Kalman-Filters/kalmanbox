site_name: kalmanbox
site_url: https://kalmanbox.nodesecon.com
site_description: >-
  Foundational library of Kalman Filter and State-Space Models for the
  NodesEcon ecosystem. Powers chronobox, forecastbox and particlefilterbox.
site_author: NodesEcon
copyright: Copyright &copy; NodesEcon. Distributed under the MIT License.

repo_url: https://github.com/nodesecon/kalmanbox
repo_name: nodesecon/kalmanbox
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: false
use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

extra_css:
  - assets/css/custom.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nodesecon/kalmanbox
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kalmanbox/
      name: PyPI
  version:
    provider: mike
    default: stable
  ecosystem:
    - name: kalmanbox
      role: Foundation - Kalman Filter & State-Space Models
    - name: chronobox
      role: Time series toolbox built on kalmanbox
    - name: forecastbox
      role: Forecasting framework leveraging kalmanbox
    - name: particlefilterbox
      role: Sequential Monte Carlo extending kalmanbox

